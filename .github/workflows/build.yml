name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify dist structure
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/sounds.html
          test -f dist/about.html
          test -f dist/license.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_headers
          test -f dist/data/sounds.json
          if find dist -name '*.map' | grep -q .; then
            echo "Source maps found in dist/"; exit 1;
          fi

      - name: Verify audio files (dynamic, from catalog)
        run: |
          python3 - <<'PY'
          import json, os, sys

          with open('data/sounds.json', encoding='utf-8') as f:
              data = json.load(f)

          sounds = data if isinstance(data, list) else data.get('sounds', [])
          if not sounds:
              print("No sounds found in catalog"); sys.exit(1)

          seen = set()
          missing = []
          for s in sounds:
              sid = s.get('id')
              if not sid:
                  print("Sound entry without id"); sys.exit(1)
              if sid in seen:
                  print(f"Duplicate sound id: {sid}"); sys.exit(1)
              seen.add(sid)

              wav = os.path.join('dist', 'audio', 'wav', sid + '.wav')
              mp3 = os.path.join('dist', 'audio', 'mp3', sid + '.mp3')
              if not os.path.isfile(wav): missing.append(wav)
              if not os.path.isfile(mp3): missing.append(mp3)

          if missing:
              print("Missing audio files:")
              for m in missing: print(" -", m)
              sys.exit(1)

          print(f"OK: {len(sounds)} sounds, all WAV + MP3 present.")
          PY

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: kyvorex-sounds-dist
          path: dist